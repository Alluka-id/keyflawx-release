<style>
  :root{
    --bg:#FFB6C1;
    --card:#FFFFFF;
    --heading:#0F172A;
    --body:#5C2434;
    --secondary:#6B2A3D;
    --border:rgba(255,255,255,.65);
    --blue:#C2185B;
    --blue-hover:#A91450;
    --blue-active:#8F0F45;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    background:var(--bg);
    color:var(--body);
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    line-height:1.5;
  }
  .page{
    width:100%;
    margin:0 auto;
    padding:32px 24px 40px;
  }
  .card{
    background:transparent;
    border:none;
    border-radius:0;
    box-shadow:none;
    padding:40px 0 36px;
  }
  .top{
    width:100%;
    max-width:448px;
    margin:0 auto;
    padding:0 32px;
  }
  .wide{
    width:100%;
  }
  .hero{
    text-align:center;
    margin-bottom:20px;
  }
  .hero img{
    width:128px;
    height:128px;
    display:block;
    margin:0 auto;
    border-radius:28px;
  }
  .hero h1{
    margin-top:14px;
    font-size:28px;
    font-weight:700;
    letter-spacing:-.02em;
    color:var(--heading);
    line-height:1.2;
    text-align:center;
  }
  .package{
    font-size:15px;
    font-weight:500;
    letter-spacing:.01em;
    color:var(--body);
    text-align:center;
    line-height:1.4;
    word-break:break-all;
  }
  .version{
    margin-top:10px;
    font-size:22px;
    font-weight:600;
    letter-spacing:-.02em;
    color:var(--heading);
    text-align:center;
    line-height:1.25;
  }
  .release-date{
    margin-top:8px;
    font-size:14px;
    color:var(--secondary);
    text-align:center;
  }
  .actions{
    margin-top:28px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    width:100%;
    min-height:52px;
    padding:12px 20px;
    border-radius:999px;
    font-size:15px;
    font-weight:600;
    text-decoration:none;
    text-align:center;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    transition:background-color .15s ease,border-color .15s ease;
  }
  .btn:focus-visible{
    outline:3px solid rgba(194,24,91,.55);
    outline-offset:3px;
  }
  .btn svg{width:18px;height:18px;flex-shrink:0}
  .btn-primary{
    background:#000000;
    color:#FFFFFF;
    border:1px solid #000000;
  }
  .btn-primary:hover{background:#1A1A1A;border-color:#1A1A1A}
  .btn-primary:active{background:#000000;border-color:#000000}
  .btn-primary:focus-visible{outline:3px solid rgba(0,0,0,.55);outline-offset:3px}
  .btn-size{font-size:13px;font-weight:500;opacity:.92;white-space:nowrap}
  .btn-secondary{
    background:#FFFFFF;
    color:var(--heading);
    border:1px solid rgba(194,24,91,.35);
  }
  .btn-secondary:hover{border-color:#C2185B;background:#FFF5F7}
  .btn-secondary svg{color:var(--blue)}
  .divider{
    height:1px;
    background:var(--border);
    border:0;
    margin:32px 0 24px;
  }
  .whats-new{
    text-align:center;
  }
  .whats-new h2{
    font-size:17px;
    font-weight:600;
    letter-spacing:-.01em;
    color:var(--heading);
    margin-bottom:16px;
    text-align:center;
  }

  .cards{
    margin-top:8px;
  }
  .cards-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:16px;
    max-width:1080px;
    margin:0 auto;
  }
  .cards-grid img{
    width:100%;
    height:auto;
    display:block;
    border-radius:20px;
  }
  @media (max-width:420px){
    .page{padding:20px 16px 28px}
    .card{padding:32px 0 28px;border-radius:0}
    .top{padding:0 22px}
    .hero img{width:112px;height:112px}
    .hero h1{font-size:26px}
    .version{font-size:21px}
    .cards-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  }
</style>
</head>

      }
      if (cfg.release_date) {
        releaseDateLine.textContent = "Release Date: " + cfg.release_date;
      }
      if (cfg.apk_url && /\.apk(\?|$)/i.test(cfg.apk_url)) {
        explicitApkUrl = cfg.apk_url;
        setDirectDownload(cfg.apk_url, cfg.apk_url.split("/").pop().split("?")[0]);
      } else if (cfg.download_url && /\.apk(\?|$)/i.test(cfg.download_url)) {
        explicitApkUrl = cfg.download_url;
        setDirectDownload(cfg.download_url, cfg.download_url.split("/").pop().split("?")[0]);
      }
      if (cfg.telegram_url) {
        telegramBtn.href = cfg.telegram_url;
      }    })
    .catch(function () {});

  fetch("https://api.github.com/repos/" + REPO + "/releases/latest", {
    headers: { "Accept": "application/vnd.github+json" }
  })
    .then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    })
    .then(function (release) {
      if (!release || !Array.isArray(release.assets)) return;
      var apkAsset = null;
      for (var i = 0; i < release.assets.length; i++) {
        var a = release.assets[i];
        if (a && typeof a.name === "string" && /\.apk$/i.test(a.name)) { apkAsset = a; break; }
      }
      if (apkAsset && apkAsset.browser_download_url) {
        if (!explicitApkUrl) {
          setDirectDownload(apkAsset.browser_download_url, apkAsset.name, apkAsset.size);
        } else if (typeof apkAsset.size === "number" && apkAsset.size > 0) {
          downloadSize.textContent = "- " + (apkAsset.size / (1024 * 1024)).toFixed(1) + " MB";
        }
      }
    })
    .catch(function () {});
})();
</script>
</body>
</html>
